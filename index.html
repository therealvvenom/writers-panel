<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Писателя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        textarea {
            flex-grow: 1; /* Растягивает поле на весь экран */
            width: 100%;
            background-color: var(--tg-theme-secondary-bg-color, #242f3d);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #7f8b9c);
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        button {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2b9eb3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Блокнот 📝</h2>
    
    <!-- Текстовое поле -->
    <textarea id="myText" placeholder="Введи черновик 11-й главы... Например, опиши, как выглядит маскировка техно-костюма в действии."></textarea>
    
    <!-- Кнопка -->
    <button onclick="sendTextToBot()">Отправить в Идеи</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Эта функция берет текст и кидает его боту
        function sendTextToBot() {
            let text = document.getElementById("myText").value;
            if (text.trim() !== "") {
                tg.sendData(text); // Отправка данных в Python
            } else {
                tg.showAlert("Текст пустой. Напиши что-нибудь!");
            }
        }
    </script>
</body>
</html>
