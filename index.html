<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Писателя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color); /* Берем цвет из темы Telegram */
            color: var(--tg-theme-text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет, Автор! 👋</h1>
        <p id="user-name"></p>
        <p>Добро пожаловать в твой цифровой штаб.</p>
        <button onclick="tg.close()">Вернуться в чат</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp; // Инициализация
        tg.expand(); // Развернуть на всё окно

        // Выводим имя пользователя из данных Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `Писатель: ${user.first_name}`;
        }
    </script>
</body>
</html>
