<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writer Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff); --text: var(--tg-theme-text-color, #37352f);
            --hint: var(--tg-theme-hint-color, #787774); --border: rgba(120, 119, 116, 0.2);
            --hover: rgba(120, 119, 116, 0.08); --danger: #eb5757;
            --btn-bg: var(--tg-theme-text-color, #37352f); --btn-text: var(--tg-theme-bg-color, #ffffff);
            --nav-bg: var(--tg-theme-bg-color, #ffffff); --link: var(--tg-theme-link-color, #007aff);
            --success: #34c759; --warning: #f2c94c;
        }

        [data-theme="dark"] {
            --bg: #181818; --text: #e0e0e0; --hint: #888888; --border: rgba(255, 255, 255, 0.1);
            --hover: rgba(255, 255, 255, 0.05); --nav-bg: #181818; --btn-bg: #e0e0e0; --btn-text: #181818;
        }

        [data-theme="light"] {
            --bg: #ffffff; --text: #37352f; --hint: #787774; --border: rgba(120, 119, 116, 0.2);
            --hover: rgba(120, 119, 116, 0.08); --nav-bg: #ffffff; --btn-bg: #37352f; --btn-text: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 0; display: flex; flex-direction: column; 
            height: 100vh; height: var(--tg-viewport-stable-height, 100vh);
            -webkit-font-smoothing: antialiased; padding-bottom: 70px; box-sizing: border-box; overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .view { display: none; padding: 20px; flex-direction: column; height: 100%; box-sizing: border-box; overflow-y: auto; opacity: 0; transform: translateY(15px); }
        .view.active { display: flex; animation: fadeSlideUp 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        @keyframes fadeSlideUp { to { opacity: 1; transform: translateY(0); } }

        /* ШАПКА ПРОФИЛЯ */
        .top-profile-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); transition: 0.3s; flex-shrink: 0; }
        .top-profile-left { display: flex; align-items: center; gap: 12px; }
        .top-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--hover); color: var(--text); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; overflow: hidden; transition: 0.3s; border: 1px solid var(--border); }
        .top-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .top-username { font-weight: 600; font-size: 16px; color: var(--text); margin-bottom: 2px; }
        
        .sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--hint); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hint); transition: 0.3s; box-shadow: 0 0 6px currentColor; }
        .status-dot.saved { background: var(--success); color: var(--success);
