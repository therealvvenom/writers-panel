<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Писателя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #18222d);
            --text: var(--tg-theme-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #242f3d);
            --button: var(--tg-theme-button-color, #2b9eb3);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #7f8b9c);
            --danger: #ff595a;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .tabs { display: flex; background-color: var(--secondary-bg); border-bottom: 1px solid var(--hint); }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; opacity: 0.6; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--button); }

        .content { flex-grow: 1; padding: 15px; display: none; flex-direction: column; overflow-y: auto; }
        .content.active { display: flex; }

        .tools { display: flex; gap: 10px; margin-bottom: 10px; }
        .tool-btn { background-color: var(--secondary-bg); color: var(--text); border: 1px solid var(--hint); padding: 8px 12px; border-radius: 5px; font-size: 14px; }

        textarea, input {
            width: 100%;
            background-color: var(--secondary-bg);
            color: var(--text);
            border: 1px solid var(--hint);
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            margin-bottom: 10px;
        }
        textarea { resize: none; }
        #myText { flex-grow: 1; }

        .btn {
            background-color: var(--button);
            color: var(--button-text);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Карточки персонажей */
        .char-card {
            background-color: var(--secondary-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--button);
            position: relative;
        }
        .del-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab active" onclick="openTab('write')">Текст 📝</div>
        <div class="tab" onclick="openTab('chars')">Персонажи 🎭</div>
    </div>

    <!-- ВКЛАДКА ТЕКСТА -->
    <div id="write" class="content active">
        <div class="tools">
            <button class="tool-btn" onclick="insertText('—')">—</button>
            <button class="tool-btn" onclick="insertText('«')">«</button>
            <button class="tool-btn" onclick="insertText('»')">»</button>
            <button class="tool-btn" onclick="insertText('...')">...</button>
        </div>
        <textarea id="myText" placeholder="Пиши здесь..."></textarea>
        <button class="btn" onclick="sendToBot()">Сохранить в Идеи</button>
    </div>

    <!-- ВКЛАДКА ПЕРСОНАЖЕЙ -->
    <div id="chars" class="content">
        <div style="background: var(--secondary-bg); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
            <input type="text" id="charName" placeholder="Имя (например, Лия)">
            <textarea id="charDesc" rows="3" placeholder="Описание (характер, костюм, роль)"></textarea>
            <button class="btn" style="width: 100%; padding: 10px;" onclick="addChar()">Добавить в список</button>
        </div>
        
        <div id="charList">
            <!-- Сюда будут подгружаться сохраненные герои -->
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let characters = []; // Тут мы храним персонажей в памяти

        // ПРИ ЗАПУСКЕ: Достаем персонажей из личного облака Telegram
        tg.CloudStorage.getItem('my_characters', function(error, value) {
            if (!error && value) {
                characters = JSON.parse(value); // Расшифровываем сохраненный текст в список
                renderChars(); // Рисуем на экране
            }
        });

        // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        function openTab(tabId) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // БЫСТРЫЕ СИМВОЛЫ
        function insertText(symbol) {
            const area = document.getElementById('myText');
            const start = area.selectionStart; const end = area.selectionEnd;
            area.value = area.value.slice(0, start) + symbol + area.value.slice(end);
            area.focus(); area.setSelectionRange(start + symbol.length, start + symbol.length);
        }

        // ОТПРАВКА БОТУ
        function sendToBot() {
            let text = document.getElementById("myText").value;
            if (text.trim() !== "") tg.sendData(text);
        }

        // ДОБАВИТЬ ПЕРСОНАЖА
        function addChar() {
            let name = document.getElementById("charName").value.trim();
            let desc = document.getElementById("charDesc").value.trim();
            
            if (!name) return tg.showAlert("Напиши хотя бы имя!");

            // Добавляем в список
            characters.push({ name: name, desc: desc });
            
            // Сохраняем обновленный список в облако Telegram!
            tg.CloudStorage.setItem('my_characters', JSON.stringify(characters));
            
            // Очищаем поля ввода и обновляем экран
            document.getElementById("charName").value = "";
            document.getElementById("charDesc").value = "";
            renderChars();
        }

        // УДАЛИТЬ ПЕРСОНАЖА
        function deleteChar(index) {
            characters.splice(index, 1); // Удаляем из списка
            tg.CloudStorage.setItem('my_characters', JSON.stringify(characters)); // Обновляем облако
            renderChars(); // Перерисовываем
        }

        // НАРИСОВАТЬ СПИСОК ПЕРСОНАЖЕЙ
        function renderChars() {
            let listDiv = document.getElementById("charList");
            listDiv.innerHTML = ""; // Очищаем старое
            
            if (characters.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; opacity:0.5;'>Список пуст. Добавь первого героя!</p>";
                return;
            }

            // Рисуем карточку для каждого
            characters.forEach((char, index) => {
                listDiv.innerHTML += `
                    <div class="char-card">
                        <button class="del-btn" onclick="deleteChar(${index})">Х</button>
                        <strong>${char.name}</strong><br>
                        <small style="white-space: pre-wrap;">${char.desc}</small>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
